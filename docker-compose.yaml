x-app: &app
  build: .
  env_file: .env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    # Share Telethon session file between authorize/host and workers
    - ./telegram_sessions:/app/telegram_sessions

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 2s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

# comment it for local development
  backend:
    <<: *app
    command: uv run -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # AI and other non-Telegram tasks (can run in parallel)
  celery-worker:
    <<: *app
    command: uv run -m celery -A celery_app worker -l info -Q celery -c 2

  # Parse (may use Telethon) + publish: ONE process at a time (-c 1)
  celery-telegram-worker:
    <<: *app
    command: uv run -m celery -A celery_app worker -l info -Q telegram -c 1

  celery-beat:
    <<: *app
    command: uv run -m celery -A celery_app beat -l info

#  flower:
#    <<: *app
#    command: uv run -m celery -A app.celery_app flower --port=5555
#    ports:
#      - "5555:5555"

volumes:
  postgres_data:
  redis_data:
