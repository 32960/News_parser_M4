[project]
name = "news-parser-m4"
version = "0.1.0"
description = "AINEWS: collect news, generate Telegram posts with OpenAI, publish on schedule"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "flower>=2.2.0",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis[hiredis]>=8.1.0",
    "sqlmodel>=0.0.47",
    "telethon>=1.45.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
